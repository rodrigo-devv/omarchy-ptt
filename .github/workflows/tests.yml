name: Portable tests
on: [push, pull_request]
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y lua5.4 desktop-file-utils xvfb python3-xlib libsnappy1v5
      - run: python -m unittest discover -s tests -v
      - run: bash -n install.sh bin/omarchy-ptt examples/fresh-install.sh
      - run: OMARCHY_PTT_GUI_TESTS=1 /usr/bin/python3 -m unittest discover -s tests -p test_configuration.py -v
      - run: python tools/build-release.py
